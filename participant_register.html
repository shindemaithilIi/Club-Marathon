<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marathon Registration - Club Marathon</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            background: linear-gradient(135deg, #f8f5ff, #fff5f8);
            font-family: Arial, sans-serif;
        }

        .top-bar {
            height: 8px;
            background: linear-gradient(
                90deg,
                #6f00b5,
                #a020f0,
                #ff4f9a,
                #ffd43b
            );
        }

        .navbar {
            background: linear-gradient(
                90deg,
                #6f00b5,
                #8b16c9
            );
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .container-box {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(111, 0, 181, 0.12);
        }

        h2 {
            color: #6f00b5;
            font-weight: bold;
        }

        .gold-line {
            width: 60px;
            height: 4px;
            background: #ffd43b;
            border-radius: 5px;
            margin: 10px 0 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #a020f0;
            box-shadow: 0 0 0 0.2rem rgba(160, 32, 240, 0.15);
        }

        .btn-register {
            background: linear-gradient(
                90deg,
                #6f00b5,
                #a020f0
            );

            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 30px;
            font-weight: bold;
        }

        .btn-register:hover {
            background: #5b0095;
            color: white;
        }

        .section-title {
            color: #8b16c9;
            font-weight: bold;
            margin-top: 10px;
        }

    </style>

</head>

<body>

<div class="top-bar"></div>

<nav class="navbar">

    <div class="container">

        <span class="navbar-brand">
            🏃 Club Marathon
        </span>

    </div>

</nav>


<div class="container">

    <div class="container-box">

        <h2>
            🏃 Marathon Registration
        </h2>

        <div class="gold-line"></div>

        <p class="text-muted">
            Complete your details to register for Club Marathon.
        </p>


        <form method="POST">

            <h5 class="section-title">
                Personal Information
            </h5>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ user['name'] }}"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <select
                        name="gender"
                        class="form-select"
                        required
                    >

                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        value="{{ user['email'] }}"
                        readonly
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Blood Group
                    </label>

                    <select
                        name="blood_group"
                        class="form-select"
                    >

                        <option value="">Select Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>

                    </select>

                </div>


                <div class="col-12 mb-3">

                    <label class="form-label">
                        Address
                    </label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"
                        required
                    ></textarea>

                </div>


                <div class="col-12 mb-4">

                    <label class="form-label">
                        Emergency Contact
                    </label>

                    <input
                        type="tel"
                        name="emergency_contact"
                        class="form-control"
                        required
                    >

                </div>

            </div>


            <h5 class="section-title">
                Marathon Details
            </h5>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Race Distance
                    </label>

                    <select
                        name="race_distance"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Race Distance
                        </option>

                        <option value="5K">
                            5K
                        </option>

                        <option value="10K">
                            10K
                        </option>

                        <option value="21K">
                            21K
                        </option>

                        <option value="42K">
                            42K
                        </option>

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        T-Shirt Size
                    </label>

                    <select
                        name="tshirt_size"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Size
                        </option>

                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>

                    </select>

                </div>


                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Membership Type
                    </label>

                    <select
                        name="membership_type"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Membership
                        </option>

                        <option value="Monthly">
                            Monthly - ₹1,500
                        </option>

                        <option value="Annual">
                            Annual - ₹18,000
                        </option>

                    </select>

                </div>

            </div>


            <div class="text-center">

                <button
                    type="submit"
                    class="btn btn-register"
                >
                    🏃 Submit Marathon Registration
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
