<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Marathon Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, rgba(123,44,191,0.15), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255,79,129,0.12), transparent 30%),
                #f8f7fc;

            color: #333;
        }

        /* =========================
           TOP NAVIGATION
        ========================= */

        .top-bar {
            background: linear-gradient(
                135deg,
                #240046,
                #5a189a,
                #7b2cbf
            );

            padding: 14px 5%;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            box-shadow: 0 4px 15px rgba(36,0,70,0.2);
        }

        .logout-btn {
            color: white;
            text-decoration: none;

            background: linear-gradient(
                135deg,
                #ff4f81,
                #d63384
            );

            padding: 9px 20px;
            border-radius: 25px;

            font-weight: bold;
            font-size: 14px;

            transition: 0.25s;
        }

        .logout-btn:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(214,51,132,0.3);
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .main-container {
            max-width: 1150px;
            margin: 35px auto 60px;
            padding: 0 20px;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .main-card {
            background: white;

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 15px 45px rgba(45, 20, 80, 0.12);

            border: 1px solid rgba(123,44,191,0.08);
        }


        /* =========================
           HEADER
        ========================= */

        .main-header {
            position: relative;

            padding: 32px 20px;

            text-align: center;

            color: white;

            background:
                radial-gradient(circle at top right,
                rgba(255,79,129,0.35),
                transparent 30%),

                linear-gradient(
                    135deg,
                    #240046,
                    #5a189a,
                    #7b2cbf
                );

            overflow: hidden;
        }

        .main-header::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(245,183,0,0.10);

            right: -60px;
            top: -80px;
        }

        .main-header h1 {
            position: relative;
            z-index: 2;

            margin: 0;

            font-size: 34px;
            font-weight: 800;

            letter-spacing: 0.5px;
        }

        .main-header p {
            position: relative;
            z-index: 2;

            margin: 7px 0 0;

            color: #f4eaff;

            font-size: 15px;
        }

        .gold-line {
            width: 65px;
            height: 4px;

            background: #f5b700;

            border-radius: 10px;

            margin: 12px auto 0;
        }


        /* =========================
           FORM BODY
        ========================= */

        .form-body {
            padding: 38px;
        }


        /* =========================
           SECTION HEADINGS
        ========================= */

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #5a189a;

            font-size: 18px;
            font-weight: 700;

            padding-bottom: 10px;

            margin-top: 25px;
            margin-bottom: 20px;

            border-bottom: 2px solid #eadcf7;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .section-icon {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #f3e8ff,
                #ffe5ef
            );

            font-size: 18px;
        }


        /* =========================
           LABELS
        ========================= */

        .form-label {
            font-weight: 600;

            color: #3f3f46;

            margin-bottom: 7px;
        }


        /* =========================
           INPUTS
        ========================= */

        .form-control,
        .form-select {
            min-height: 46px;

            border: 1.5px solid #ded7e7;

            border-radius: 10px;

            background: #fcfbfe;

            padding: 10px 13px;

            transition: 0.25s;

            font-size: 14px;
        }

        textarea.form-control {
            min-height: 85px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #8e2de2;

            background: white;

            box-shadow:
                0 0 0 3px rgba(142,45,226,0.10);
        }

        .form-control::placeholder {
            color: #aaa;
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-btn {
            width: 100%;

            border: none;

            padding: 15px;

            margin-top: 20px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6a0dad,
                    #9d2cff
                );

            color: white;

            font-size: 17px;
            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(106,13,173,0.25);

            transition: 0.25s;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #ff4f81,
                    #d63384
                );

            box-shadow:
                0 10px 24px rgba(214,51,132,0.25);
        }


        /* =========================
           NAVIGATION BUTTONS
        ========================= */

        .navigation {
            margin-top: 28px;

            padding-top: 25px;

            border-top: 1px solid #eee;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }

        .nav-btn {
            display: block;

            text-align: center;

            text-decoration: none;

            padding: 12px 10px;

            border-radius: 10px;

            font-weight: 600;

            transition: 0.25s;
        }

        .participants-btn {
            background: #f3e8ff;
            color: #6a0dad;
        }

        .dashboard-btn {
            background: #ffe8f0;
            color: #c2185b;
        }

        .reports-btn {
            background: #fff4d6;
            color: #9a6b00;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            color: inherit;
            box-shadow: 0 5px 14px rgba(0,0,0,0.08);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .form-body {
                padding: 24px 18px;
            }

            .main-container {
                margin-top: 20px;
                padding: 0 12px;
            }

            .main-header {
                padding: 27px 15px;
            }
            .club-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    border-radius: 50%;
    background: white;
    padding: 5px;
    margin-bottom: 10px;
    position: relative;
    z-index: 2;
}

            .main-header h1 {
                font-size: 27px;
            }

            .navigation {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 16px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="top-bar">

    <a href="/logout"
       class="logout-btn">

        🚪 Logout

    </a>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="main-container">

    <div class="main-card">


        <!-- HEADER -->

        <div class="main-header">

            <img src="{{ url_for('static'), filename='logo.jpeg' }}"
                alt="Club Marathon Logo"
                class="club-logo">

            <h1>
                🏃 Club Marathon
            </h1>

            <p>
                Participant Registration System
            </p>

            <div class="gold-line"></div>

        </div>


        <!-- FORM BODY -->

        <div class="form-body">


            <form action="/register" method="POST">


                <!-- =========================
                     PERSONAL INFORMATION
                ========================= -->

                <div class="section-title">

                    <div class="section-icon">
                        👤
                    </div>

                    Personal Information

                </div>


                <div class="row">


                    <!-- FULL NAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter Full Name"
                            required
                        >

                    </div>


                    <!-- AGE -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            min="10"
                            max="100"
                            placeholder="Enter Age"
                            required
                        >

                    </div>


                    <!-- GENDER -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            name="gender"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- =========================
                     CONTACT
                ========================= -->

                <div class="section-title">

                    <div class="section-icon">
                        📞
                    </div>

                    Contact Information

                </div>


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter Email"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            name="mobile"
                            class="form-control"
                            placeholder="10 digit mobile number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            required
                        >

                    </div>


                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="2"
                            placeholder="Enter Address"
                        ></textarea>

                    </div>

                </div>


                <!-- =========================
                     EMERGENCY
                ========================= -->

                <div class="section-title">

                    <div class="section-icon">
                        🩺
                    </div>

                    Emergency Information

                </div>


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Blood Group
                        </label>

                        <select
                            name="blood_group"
                            class="form-select"
                        >

                            <option value="">
                                Select Blood Group
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Emergency Contact
                        </label>

                        <input
                            type="tel"
                            name="emergency_contact"
                            class="form-control"
                            placeholder="Emergency contact number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                        >

                    </div>

                </div>


                <!-- =========================
                     RACE
                ========================= -->

                <div class="section-title">

                    <div class="section-icon">
                        🏁
                    </div>

                    Race Information

                </div>


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Race Distance
                        </label>

                        <select
                            name="race_distance"
                            id="race_distance"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Distance
                            </option>

                            <option value="5K">5K</option>
                            <option value="10K">10K</option>
                            <option value="21K">21K</option>
                            <option value="42K">42K</option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            T-Shirt Size
                        </label>

                        <select
                            name="tshirt_size"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Size
                            </option>

                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                            <option value="XXXL">XXXL</option>

                        </select>

                    </div>

                </div>


                <!-- =========================
                     MEDICAL
                ========================= -->

                <div class="section-title">

                    <div class="section-icon">
                        📋
                    </div>

                    Medical & Previous Participation

                </div>


                <div class="row">


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Medical Certificate
                        </label>

                        <select
                            name="medical_certificate"
                            class="form-select"
                        >

                            <option value="">
                                Select
                            </option>

                            <option value="Submitted">
                                Submitted
                            </option>

                            <option value="Not Submitted">
                                Not Submitted
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Previous Participant
                        </label>

                        <select
                            name="previous_participant"
                            class="form-select"
                        >

                            <option value="">
                                Select
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No">
                                No
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Previous Certificate
                        </label>

                        <select
                            name="previous_certificate"
                            class="form-select"
                        >

                            <option value="">
                                Select
                            </option>

                            <option value="Available">
                                Available
                            </option>

                            <option value="Not Available">
                                Not Available
                            </option>

                        </select>

                    </div>

                </div>


                <!-- =========================
                     PAYMENT
                ========================= -->

                <div class="section-title">

                    <div class="section-icon">
                        💳
                    </div>

                    Payment & Membership Information

                </div>


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Membership Type
                        </label>

                        <select
                            name="membership_type"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Membership
                            </option>

                            <option value="Annual Membership">
                                Annual Membership - ₹18,000/year
                            </option>

                            <option value="Personal Training">
                                Personal Training - ₹1,500/month
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Fee Status
                        </label>

                        <select
                            name="fee_status"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Payment Status
                            </option>

                            <option value="Paid">
                                Paid
                            </option>

                            <option value="Pending">
                                Pending
                            </option>

                        </select>

                    </div>

                </div>


                <!-- =========================
                     REGISTER
                ========================= -->

                <button
                    type="submit"
                    class="register-btn"
                >

                    🏃 Register Participant

                </button>


            </form>


            <!-- =========================
                 NAVIGATION
            ========================= -->

            <div class="navigation">


                <a
                    href="/view"
                    class="nav-btn participants-btn"
                >

                    👥 View Participants

                </a>


                <a
                    href="/dashboard"
                    class="nav-btn dashboard-btn"
                >

                    📊 Open Dashboard

                </a>


                <a
                    href="/reports"
                    class="nav-btn reports-btn"
                >

                    📈 View Reports

                </a>


            </div>


        </div>

    </div>

</div>


</body>

</html>
