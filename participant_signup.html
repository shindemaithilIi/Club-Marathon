<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participant Signup - Club Marathon</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f5ff, #fff5f8);
            font-family: Arial, sans-serif;
        }

        .top-bar {
            height: 8px;
            background: linear-gradient(
                90deg,
                #6f00b5,
                #a020f0,
                #ff4f9a,
                #ffd43b
            );
        }

        .signup-box {
            max-width: 460px;
            margin: 55px auto;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(111, 0, 181, 0.15);
            border: 1px solid #eee2ff;
        }

        .logo-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-circle {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6f00b5, #a020f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 5px 15px rgba(111, 0, 181, 0.25);
        }

        .logo-title h2 {
            margin: 0;
            font-weight: 700;
            color: #6f00b5;
        }

        .logo-title p {
            margin-top: 7px;
            color: #777;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #a020f0;
            box-shadow: 0 0 0 0.2rem rgba(160, 32, 240, 0.15);
        }

        .btn-signup {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            color: white;

            background: linear-gradient(
                90deg,
                #6f00b5,
                #a020f0
            );

            box-shadow: 0 5px 12px rgba(111, 0, 181, 0.25);
        }

        .btn-signup:hover {
            background: linear-gradient(
                90deg,
                #5b0095,
                #8d18d5
            );
            color: white;
        }

        .gold-line {
            width: 55px;
            height: 4px;
            margin: 10px auto 20px;
            border-radius: 5px;
            background: #ffd43b;
        }

        a {
            color: #8b16c9;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: #ff4f9a;
        }

        .admin-link {
            color: #777;
            font-size: 14px;
        }

        .alert-danger {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="top-bar"></div>

<div class="container">

    <div class="signup-box">

        <div class="logo-title">

            <div class="logo-circle">
                🏃
            </div>

            <h2>Club Marathon</h2>

            <div class="gold-line"></div>

            <p>Participant Registration</p>

        </div>


        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Re-enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-signup"
            >
                Create Participant Account
            </button>

        </form>


        <div class="text-center mt-4">

            <p>
                Already have an account?
                <a href="/participant_login">
                    Login here
                </a>
            </p>

            <a href="/login" class="admin-link">
                Admin Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
