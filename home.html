<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Marathon</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #3b0066,
                #6f00b5,
                #ff4f9a
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-card {
            width: 90%;
            max-width: 650px;
            background: white;
            border-radius: 25px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            width: 130px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            color: #6f00b5;
            font-weight: bold;
            font-size: 42px;
        }

        .subtitle {
            color: #777;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .welcome {
            color: #555;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            display: block;
        }

        .btn-register {
            background: linear-gradient(
                90deg,
                #6f00b5,
                #a020f0
            );
            color: white;
        }

        .btn-participant {
            background: #ff4f9a;
            color: white;
        }

        .btn-admin {
            background: #eeeeee;
            color: #444;
        }

        .btn-main:hover {
            opacity: 0.9;
            color: white;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="main-card">

        <img
            src="{{ url_for('static', filename='logo.jpeg') }}"
            class="logo"
            alt="Club Marathon Logo"
        >

        <h1>🏃 Club Marathon</h1>

        <div class="subtitle">
            Participant Management System
        </div>

        <p class="welcome">
            Welcome to Club Marathon!<br>
            Register for the marathon, manage your participation
            and access your payment receipt.
        </p>


        <!-- PARTICIPANT REGISTRATION -->

        <a
            href="/participant_register"
            class="btn-main btn-register"
        >
            🏃 Participant Registration
        </a>


        <!-- PARTICIPANT LOGIN -->

        <a
            href="/participant_login"
            class="btn-main btn-participant"
        >
            👤 Participant Login
        </a>


        <!-- ADMIN LOGIN -->

        <a
            href="/login"
            class="btn-main btn-admin"
        >
            🔐 Admin Login
        </a>


        <div class="footer">
            Club Marathon • Run • Register • Achieve
        </div>

    </div>

</body>

</html>
