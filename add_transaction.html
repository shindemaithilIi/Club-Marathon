<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - Club Marathon</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/dashboard">
            🏃 Club Marathon
        </a>

        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-1">
                Home
            </a>

            <a href="/dashboard" class="btn btn-outline-light btn-sm me-1">
                Dashboard
            </a>

            <a href="/transactions" class="btn btn-outline-light btn-sm">
                Transactions
            </a>
        </div>

    </div>
</nav>


<!-- MAIN CONTAINER -->
<div class="container mt-5 mb-5">

    <div class="card shadow-lg border-0 mx-auto" style="max-width: 700px;">

        <!-- HEADER -->
        <div class="card-header bg-primary text-white text-center p-4">

            <h2 class="mb-1">
                💳 Add Transaction
            </h2>

            <p class="mb-0">
                Record Participant Payment
            </p>

        </div>


        <!-- FORM -->
        <div class="card-body p-4">

            <form action="/save_transaction" method="POST">

                <!-- PARTICIPANT -->
                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Participant
                    </label>

                    <select name="participant_id"
                            id="participant_id"
                            class="form-select"
                            required>

                        <option value="">
                            Select Participant
                        </option>

                        {% for participant in participants %}

                        <option value="{{ participant[0] }}">
                            {{ participant[1] }}
                            {% if participant[2] %}
                            - {{ participant[2] }}
                            {% endif %}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- AMOUNT -->
                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Amount (₹)
                    </label>

                    <input type="number"
                           name="amount"
                           id="amount"
                           class="form-control"
                           placeholder="Enter Amount"
                           min="0"
                           required>

                </div>


                <!-- PAYMENT METHOD -->
                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Payment Method
                    </label>

                    <select name="payment_method"
                            class="form-select"
                            required>

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Card">
                            Card
                        </option>

                        <option value="Bank Transfer">
                            Bank Transfer
                        </option>

                    </select>

                </div>


                <!-- PAYMENT STATUS -->
                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Payment Status
                    </label>

                    <select name="payment_status"
                            class="form-select"
                            required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="Paid">
                            Paid
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                    </select>

                </div>


                <!-- SUBMIT -->
                <button type="submit"
                        class="btn btn-primary btn-lg w-100">

                    💳 Save Transaction

                </button>

            </form>


            <!-- BACK -->
            <a href="/transactions"
               class="btn btn-secondary w-100 mt-3">

                ← View Transactions

            </a>

        </div>

    </div>

</div>


<footer class="text-center text-muted mb-3">

    Club Marathon Participant Registration System

</footer>

</body>
</html>
